version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: it-asset-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: itam
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db_init/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  web:
    build: .
    container_name: it-asset-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

volumes:
  db_data:
